      options: [{ id: "students", label: "Students" }, { id: "attendance", label: "Attendance" }].concat(canSeeFees ? [{ id: "fees", label: "Fees" }] : [])
    })),

    tab === "students" ? (students.length === 0
      ? h("div", { className: "empty", style: { marginTop: 16 } }, h("h3", null, "No students in this class yet"),
        h("p", null, canEditStudents ? "Add the class list first. Scores can come later." : "The teacher hasn't added students yet."),
        canEditStudents ? h("button", { className: "btn btn-primary", onClick: onAddStudent }, "Add students") : null)
      : h(Frag, null,
        h("div", { className: "tools" }, h("span", { className: "tnum" }, scoredCount + " of " + students.length + " have scores, " + (termMonths(ctx.range) || "this term"))),
        students.length > 8 ? h("div", { className: "search" }, Icon.search(), h("input", { value: q, onChange: e => setQ(e.target.value), placeholder: "Find a student", "aria-label": "Find a student" })) : null,
        h("div", { className: "list" }, shown.map(({ s, rec }) => {
          const pos = ctx.classRanks[s.id];
          const t = tally(attIn(s.attendance, ctx.range));
          return h("button", { key: s.id, className: "row", onClick: () => setSheetId(s.id) },
            h(Av, { s }),
            h("div", { className: "row-main" }, h("div", { className: "row-title" }, s.name),
              h("div", { className: "row-sub tnum" }, hasMarks(rec) ? "Total " + totalOf(rec) + (pos ? ", " + ordinal(pos) + " in class" : "") : "No scores yet")),
            h("div", { className: "row-end" },
              t.marked ? h("span", { className: "tnum", style: { color: t.rate >= 75 ? "var(--ink-2)" : "var(--danger)", fontSize: 13, fontWeight: 600 } }, t.rate + "%") : null,
              h(Chev)));
        })),
        shown.length === 0 ? h("p", { className: "hint", style: { margin: "12px 4px" } }, "No student matches that name.") : null)) : null,

    tab === "attendance" ? h(AttendanceView, { students, ctx, readOnly: !canEditStudents, role, onReload, onOpenStudent: s => setSheetId(s.id) }) : null,
    tab === "fees" && canSeeFees ? h(FeesView, { rows, ctx, role, onReload, onOpenStudent: s => setSheetId(s.id) }) : null,

    sheetRow ? h(StudentSheet, { student: sheetRow.s, rec: sheetRow.rec, ctx, role, canEdit: canEditStudents, onEdit: onEditStudent, onDelete: onDeleteStudent, onClose: () => setSheetId(null) }) : null,
    actions ? h(ActionSheet, {
      title: folder.class_name, sub: termWithMonths(term, terms), onClose: () => setActions(false),
      items: [
        students.length ? { label: "Print all report cards", sub: "One page per student, ready to print", onClick: () => printAllReportCards(students, ctx) } : null,
        canEditStudents && students.length ? (submitted
          ? { label: "Reopen for editing", sub: "Marks the class as in progress again", onClick: () => setStatus("in_progress") }
          : { label: "Mark this term submitted", sub: "Tells the headmaster the scores are final", onClick: () => setStatus("submitted") }) : null,
        canEditStudents ? { label: "Edit class details", onClick: () => onEditClass(folder) } : null,
        isHead(role) ? { label: "Delete class", danger: true, onClick: () => onDeleteClass(folder) } : null
      ]
    }) : null);
}

/* ============================================================
   Home: today's picture, then one flat list of classes
   ============================================================ */
function Home({ role, userName, folders, students, counts, term, terms, branch, setBranch, allAccounts, edits, onClearEdits, onOpen, onNewClass, onSchoolSettings, schoolConfigured, onManageStaff }) {
  const [showEdits, setShowEdits] = useState(false);
  const isOwner = role === "owner";
  const hour = new Date().getHours();
  const greeting = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const today = todayISO();
  const range = termRange(term, terms);
  const ids = new Set(folders.map(f => f.id));
  const mine = students.filter(s => ids.has(s.class_id));
  const inTerm = inRange(today, range);
  let attFig;
  if (inTerm) {
    const marked = mine.filter(s => (s.attendance || {})[today]);
    const p = marked.filter(s => s.attendance[today] === "present").length;
    attFig = h(Fig, { n: marked.length ? Math.round(p / marked.length * 100) + "%" : "—", l: marked.length ? "Present today" : "Register not taken" });
  } else {
    const t = mine.reduce((acc, s) => { const x = tally(attIn(s.attendance, range)); acc.p += x.present; acc.m += x.marked; return acc; }, { p: 0, m: 0 });
    attFig = h(Fig, { n: t.m ? Math.round(t.p / t.m * 100) + "%" : "—", l: "Term attendance" });
  }
  const submitted = folders.filter(f => classStatus(f, term) === "submitted").length;
  const missingHeads = BRANCHES.filter(b => !allAccounts.some(a => a.role === "headmaster" && a.branch === b.id));
  const visibleMissing = isOwner ? missingHeads.filter(b => !branch || b.id === branch) : [];

  const classRow = f => {
    const done = classStatus(f, term) === "submitted";
    return h("button", { key: f.id, className: "row", onClick: () => onOpen(f) },
      h("div", { className: "tile" }, classCode(f.class_name)),
      h("div", { className: "row-main" }, h("div", { className: "row-title" }, f.class_name), h("div", { className: "row-sub" }, teacherNames(f) || "No teacher assigned")),
      h("div", { className: "row-end" },
        h("span", { className: "tnum" }, counts[f.id] || 0),
        h("span", { className: "sdot" + (done ? " ok" : ""), title: done ? "Submitted" : "In progress" }),
        h(Chev)));
  };
  const groups = isOwner && !branch
    ? BRANCHES.map(b => ({ label: b.label, items: folders.filter(f => f.branch === b.id) }))
      .concat([{ label: "No location", items: folders.filter(f => !BRANCHES.some(b => b.id === f.branch)) }])
      .filter(g => g.items.length)
    : [{ label: null, items: folders }];
  const canCreate = isHead(role);

  return h("div", null,
    h("div", { className: "greet" }, greeting + (userName ? ", " + userName : "")),
    h("h1", { className: "h1" }, new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })),
    isOwner ? h("div", { className: "seg-wrap" }, h(Seg, { value: branch, onChange: setBranch, options: [{ id: "", label: "All" }].concat(BRANCHES.map(b => ({ id: b.id, label: b.label.replace(/\s*\(.*\)/, "") }))) })) : null,
    h("div", { className: "figs" }, h(Fig, { n: mine.length, l: mine.length === 1 ? "Student" : "Students" }), attFig, h(Fig, { n: h(Frag, null, submitted, h("small", null, "/" + folders.length)), l: "Classes submitted" })),

    role === "headmaster" && !schoolConfigured ? h("div", { className: "notice info" },
      h("div", { className: "grow" }, "Add your school's name and address so they print on report cards."),
      h("button", { className: "btn btn-sm btn-primary", onClick: onSchoolSettings }, "Set up")) : null,
    visibleMissing.length ? h("div", { className: "notice" },
      h("div", { className: "grow" }, h("strong", null, visibleMissing.map(b => b.label.replace(/\s*\(.*\)/, "")).join(" and ")), " has no headmaster yet."),
      h("button", { className: "btn btn-sm", onClick: onManageStaff }, "Assign")) : null,
    isOwner && edits.length ? h("div", { className: "notice" },
      h("div", { className: "grow" },
        h("strong", null, edits.length + (edits.length === 1 ? " change" : " changes") + " to review. "),
        "Renamed records and corrected attendance.",
        showEdits ? h("ul", null, edits.slice(0, 8).map((e, i) => h("li", { key: i }, e.detail))) : null),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 6 } },
        h("button", { className: "btn btn-sm", onClick: () => setShowEdits(v => !v) }, showEdits ? "Hide" : "Review"),
        showEdits ? h("button", { className: "btn btn-sm btn-ghost", onClick: onClearEdits }, "Clear") : null)) : null,

    folders.length === 0
      ? h("div", { className: "empty", style: { marginTop: 22 } }, h("h3", null, "No classes yet"),
        h("p", null, canCreate ? "Create a class, then add its students." : "Your headmaster hasn't assigned you a class yet."),
        canCreate ? h("button", { className: "btn btn-primary", onClick: onNewClass }, "Create a class") : null)
      : groups.map((g, gi) => h(Frag, { key: gi },
        h("div", { className: "sec" },
          h("h2", null, g.label || "Classes", h("span", { className: "count" }, g.items.length)),
          gi === 0 && canCreate ? h("button", { className: "link", onClick: onNewClass }, "+ New class") : null),
        h("div", { className: "list" }, g.items.map(classRow)))));
}

/* ============================================================
   App shell
   ============================================================ */
const LAUNCH_KEY = "da_launch_notice_v1";
function App() {
  const saved = store.get(SESSION_KEY) || {};
  const [role, setRole] = useState(saved.role || null);
  const [account, setAccount] = useState(saved.account || null);
  const [isMaster, setIsMaster] = useState(!!saved.isMaster);
  const [folders, setFolders] = useState([]);
  const [students, setStudents] = useState([]);
  const [edits, setEdits] = useState([]);
  const [settings, setSettings] = useState(null);
  const [allAccounts, setAllAccounts] = useState([]);
  const [terms, setTerms] = useState([LEGACY_TERM]);
  const [termsTable, setTermsTable] = useState(false);
  const [activeTermId, setActiveTermId] = useState(store.get(TERM_KEY));
  const [booted, setBooted] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [branch, setBranch] = useState("");
  const [classModal, setClassModal] = useState(null);
  const [studentModal, setStudentModal] = useState(null);
  const [schoolModal, setSchoolModal] = useState(false);
  const [staffModal, setStaffModal] = useState(false);
  const [termSheet, setTermSheet] = useState(false);
  const [menu, setMenu] = useState(false);
  // Launch notice: shown once per phone until the person taps Got it.
  const [launchSeen, setLaunchSeen] = useState(!!store.get(LAUNCH_KEY));
  const dismissLaunch = () => { store.set(LAUNCH_KEY, true); setLaunchSeen(true); };

  const term = terms.find(t => t.id === activeTermId) || terms.find(t => t.is_current) || sortTerms(terms).slice(-1)[0] || LEGACY_TERM;
  const pickTerm = id => { setActiveTermId(id); store.set(TERM_KEY, id); window.scrollTo({ top: 0 }); };
  const goCurrent = () => { const c = terms.find(t => t.is_current); if (c) pickTerm(c.id); };

  const signOut = () => {
    store.del(SESSION_KEY);
    setMenu(false); setRole(null); setAccount(null); setIsMaster(false);
    setFolders([]); setStudents([]); setEdits([]); setSettings(null); setAllAccounts([]);
    setOpenId(null); setBranch(""); setBooted(false);
  };

  const load = useCallback(async () => {
    if (!sb) return;
    const [fRes, sRes, tRes] = await Promise.all([
      sb.from("classes").select("*").order("class_name"),
      sb.from("students").select("*").order("name"),
      sb.from("academic_terms").select("*").order("starts_on")
    ]);
    if (!tRes.error) { setTermsTable(true); setTerms(tRes.data && tRes.data.length ? tRes.data : [LEGACY_TERM]); }
    else { setTermsTable(false); setTerms([LEGACY_TERM]); }
    if (!fRes.error) {
      let f = fRes.data || [];
      // Teachers and headmasters see their own location; accounts without a
      // location (older ones) see everything so nobody is locked out.
      if (!isMaster && account && account.branch && (role === "teacher" || role === "headmaster")) f = f.filter(x => (x.branch || null) === account.branch);
      if ((role === "owner" || isMaster) && branch) f = f.filter(x => (x.branch || null) === branch);
      if (role === "teacher" && account && !isMaster) {
        const full = normName(account.first_name + " " + account.last_name);
        f = f.filter(x => normName(x.teacher_name) === full || normName(x.teacher_name_2) === full || (account.class_id && x.id === account.class_id));
      }
      setFolders(f);
    }
    if (!sRes.error) setStudents(sRes.data || []);
    try { const g = await sb.from("school_settings").select("*").eq("id", 1).maybeSingle(); if (!g.error) setSettings(g.data || null); } catch (e) {}
    if (role === "owner" || isMaster) {
      try { const e = await sb.from("edit_log").select("*").order("created_at", { ascending: false }).limit(20); if (!e.error) setEdits(e.data || []); } catch (e) {}
      try { const a = await sb.from("accounts").select("id,role,first_name,last_name,phone,branch").in("role", ["teacher", "headmaster"]); if (!a.error) setAllAccounts(a.data || []); } catch (e) {}
    }
    setBooted(true);
  }, [role, account, isMaster, branch]);
  useEffect(() => { if (role) load(); }, [role, load]);

  // Live updates: marks, payments and term changes show up on every open
  // phone within a second. A gentle poll covers the case where Realtime
  // isn't switched on for these tables.
  useEffect(() => {
    if (!sb || !role) return;
    let t = null;
    const bump = () => { clearTimeout(t); t = setTimeout(load, 400); };
    let ch = null;
    try {
      ch = sb.channel("live-records");
      ["students", "fee_payments", "classes", "academic_terms"].forEach(tb => ch.on("postgres_changes", { event: "*", schema: "public", table: tb }, bump));
      ch.subscribe();
    } catch (e) {}
    const poll = setInterval(() => { if (!document.hidden) load(); }, 25000);
    return () => { clearTimeout(t); clearInterval(poll); if (ch) { try { sb.removeChannel(ch); } catch (e) {} } };
  }, [role, load]);

  // A teacher with exactly one class goes straight into it.
  const singleClass = role === "teacher" && !isMaster && folders.length === 1;
  useEffect(() => { if (singleClass && !openId) setOpenId(folders[0].id); }, [singleClass, folders, openId]);

  const counts = {};
  students.forEach(s => { counts[s.class_id] = (counts[s.class_id] || 0) + 1; });
  const openFolder = openId ? folders.find(f => f.id === openId) : null;
  const classStudents = openFolder ? students.filter(s => s.class_id === openFolder.id) : [];
  const school = resolveSchool(settings);
  const canEditStudents = role === "teacher" || isHead(role);

  const removeStudent = async s => {
    if (!confirm(`Delete ${s.name}?\n\nThis removes the student and all their records, in every term. It cannot be undone.`)) return;
    await sb.from("students").delete().eq("id", s.id);
    load();
  };
  const removeClass = async f => {
    if (!confirm(`Delete ${f.class_name} and all its students?\n\nEvery term's records for this class will be removed. It cannot be undone.`)) return;
    await sb.from("students").delete().eq("class_id", f.id);
    await sb.from("classes").delete().eq("id", f.id);
    setOpenId(null);
    load();
  };
  const clearEdits = async () => { try { await sb.from("edit_log").delete().neq("id", 0); } catch (e) {} setEdits([]); };
  const switchRole = r => { setOpenId(null); setRole(r); store.set(SESSION_KEY, { role: r, account, isMaster }); };

  if (!isConfigured) return h("div", { className: "config-warn" }, h("strong", null, "Almost ready. "), "Fill in the CONFIG values at the top of the file.");
  if (!role) return h(Login, {
    onLogin: ({ role: r, account: a, isMaster: m }) => {
      setAccount(a || null); setIsMaster(!!m); setRole(r);
      store.set(SESSION_KEY, { role: r, account: a || null, isMaster: !!m });
      scheduleViewportSettle();
    }
  });

  const firstName = account && account.first_name ? account.first_name : "";
  const pastTerm = !term.virtual && !term.is_current && terms.some(t => t.is_current);
  const plus = openFolder ? (canEditStudents ? () => setStudentModal("new") : null) : (isHead(role) ? () => setClassModal("new") : null);

  return h("div", null,
    h("header", { className: "topbar" }, h("div", { className: "wrap" },
      h("div", { className: "brand" }, h(Logo), h("span", { className: "brand-name" }, school.name.replace(/\b\w+/g, w => w[0] + w.slice(1).toLowerCase()))),
      h("button", { className: "term-chip" + (pastTerm ? " past" : ""), onClick: () => setTermSheet(true), "aria-label": "Change term, now " + termName(term) },
        h("span", { className: "dot" }), shortTerm(term), Icon.down()),
      h("button", { className: "avatar-btn", onClick: () => setMenu(true), "aria-label": "Account menu" }, firstName ? firstName[0].toUpperCase() : isMaster ? "M" : "D"))),

    h("main", { className: "wrap page" },
      booted && !launchSeen ? h("div", { className: "notice ok", role: "status", style: { marginTop: 4, marginBottom: 4 } },
        h("div", { className: "grow" }, h("strong", null, "Last year's term records have been saved. "), "You can now use the app every day to mark attendance and enter scores."),
        h("button", { className: "btn btn-sm", onClick: dismissLaunch }, "Got it")) : null,
      pastTerm ? h("div", { className: "notice info", style: { marginTop: 4, marginBottom: 4 } },
        h("div", { className: "grow" }, "You're looking at ", h("strong", null, termName(term)), ", records from ", termMonths(termRange(term, terms), true), "."),
        h("button", { className: "btn btn-sm", onClick: goCurrent }, "Current term")) : null,
      !booted ? h("div", { className: "loading" }, "Loading…")
        : openFolder ? h(ClassView, {
          role, folder: openFolder, students: classStudents, term, terms, school,
          showBack: !singleClass, onBack: () => setOpenId(null), onReload: load,
          onAddStudent: () => setStudentModal("new"), onEditStudent: s => setStudentModal(s), onDeleteStudent: removeStudent,
          onEditClass: f => setClassModal(f), onDeleteClass: removeClass
        })
        : h(Home, {
          role, userName: firstName, folders, students, counts, term, terms,
          branch, setBranch: b => { setOpenId(null); setBranch(b); }, allAccounts, edits, onClearEdits: clearEdits,
          onOpen: f => { setOpenId(f.id); window.scrollTo({ top: 0 }); }, onNewClass: () => setClassModal("new"),
          onSchoolSettings: () => setSchoolModal(true), schoolConfigured: !!(settings && settings.name), onManageStaff: () => setStaffModal(true)
        })),

    h("nav", { className: "bottom-nav", "aria-label": "Main" }, h("div", { className: "inner" },
      h("button", { className: "nav-item" + (!openFolder ? " on" : ""), onClick: () => { if (!singleClass) setOpenId(null); window.scrollTo({ top: 0 }); } }, Icon.home(), h("span", null, singleClass ? "My class" : "Home")),
      plus ? h("button", { className: "nav-add", onClick: plus, "aria-label": openFolder ? "Add student" : "New class" }, Icon.plus(26)) : h("span", { className: "nav-spacer" }),
      h("button", { className: "nav-item" + (menu ? " on" : ""), onClick: () => setMenu(true) }, Icon.menu(), h("span", null, "Menu")))),

    classModal ? h(ClassModal, {
      folder: classModal === "new" ? null : classModal, role,
      accountBranch: (account && account.branch) || branch || null,
      lockedBranch: role === "owner" && branch ? branch : null,
      onClose: () => setClassModal(null), onSaved: () => { setClassModal(null); load(); }
    }) : null,
    studentModal && openFolder ? h(StudentModal, {
      key: (studentModal === "new" ? "new" : studentModal.id) + term.id,
      student: studentModal === "new" ? null : studentModal, classId: openFolder.id, term, terms,
      submitted: classStatus(openFolder, term) === "submitted",
      onClose: () => setStudentModal(null), onSaved: load
    }) : null,
    schoolModal ? h(SchoolSettingsModal, { settings, onClose: () => setSchoolModal(false), onSaved: () => { setSchoolModal(false); load(); } }) : null,
    staffModal ? h(ManageStaffModal, { onClose: () => setStaffModal(false), onChanged: load }) : null,
    termSheet ? h(TermsSheet, { terms, activeTerm: term, canManage: isHead(role), tableReady: termsTable, students, folders, onPick: pickTerm, onClose: () => setTermSheet(false), onChanged: load }) : null,

    menu ? h(Sheet, { title: firstName ? firstName + (account.last_name ? " " + account.last_name : "") : isMaster ? "Master account" : "Signed in", sub: isMaster ? "Developer access" : ROLE_LABELS[role], onClose: () => setMenu(false) },
      isMaster ? h("label", { className: "field" }, h("span", { className: "label" }, "Viewing as"),
        h("select", { value: role, onChange: e => switchRole(e.target.value) },
          h("option", { value: "teacher" }, "Teacher"), h("option", { value: "headmaster" }, "Headmaster"), h("option", { value: "owner" }, "Owner"))) : null,
      isMaster && role !== "owner" ? h("label", { className: "field" }, h("span", { className: "label" }, "Location"),
        h("select", { value: branch, onChange: e => { setOpenId(null); setBranch(e.target.value); } },
          h("option", { value: "" }, "All locations"), BRANCHES.map(b => h("option", { key: b.id, value: b.id }, b.label)))) : null,
      h("div", { className: "list" },
        h("button", { className: "row flat", onClick: () => { setMenu(false); setTermSheet(true); } },
          h("div", { className: "row-main" }, h("div", { className: "row-title" }, "Terms and academic years"), h("div", { className: "row-sub" }, termWithMonths(term, terms))), h(Chev)),
        role === "owner" || isMaster ? h("button", { className: "row flat", onClick: () => { setMenu(false); setStaffModal(true); } },
          h("div", { className: "row-main" }, h("div", { className: "row-title" }, "Staff"), h("div", { className: "row-sub" }, "Headmasters and teacher sign-ins")), h(Chev)) : null,
        isHead(role) ? h("button", { className: "row flat", onClick: () => { setMenu(false); setSchoolModal(true); } },
          h("div", { className: "row-main" }, h("div", { className: "row-title" }, "School information"), h("div", { className: "row-sub" }, "Printed on report cards")), h(Chev)) : null),
      h("div", { className: "list", style: { marginTop: 14 } },
        h("button", { className: "row flat danger", onClick: signOut }, h("div", { className: "row-main" }, h("div", { className: "row-title" }, "Sign out"))))) : null);
}

/* ---------- Viewport settle (iOS first-paint and zoom-after-login fix) ---------- */
function settleViewport() {
  try {
    const ae = document.activeElement;
    if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) ae.blur();
    void document.documentElement.offsetHeight;
    window.dispatchEvent(new Event("resize"));
  } catch (e) {}
}
function scheduleViewportSettle() {
  [0, 60, 200, 500].forEach(t => setTimeout(settleViewport, t));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settleViewport).catch(() => {});
}
window.addEventListener("pageshow", scheduleViewportSettle);
window.addEventListener("orientationchange", () => setTimeout(settleViewport, 250));

/* ---------- Boot ---------- */
function mount() {
  try {
    if (isConfigured && window.supabase && !sb) sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    scheduleViewportSettle();
  } catch (e) {
    document.getElementById("root").innerHTML = '<div class="config-warn"><strong>Startup error.</strong><br>' + esc(e && e.message ? e.message : String(e)) + '</div>';
  }
}
if (isConfigured && !window.__DA_TEST__) {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  s.onload = mount;
  s.onerror = () => { document.getElementById("root").innerHTML = '<div class="config-warn">Could not load the database library. Check your internet connection and refresh.</div>'; };
  document.head.appendChild(s);
} else {
  mount();
}
</script>
